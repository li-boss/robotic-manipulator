<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>机械臂摄像头</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101923;color:#eaf1f8;font:16px/1.6 system-ui,sans-serif}main{max-width:1000px;margin:40px auto;padding:0 24px}h1{font-size:28px;margin-bottom:4px}.muted{color:#9bafc2}header{display:flex;justify-content:space-between;align-items:center;gap:20px}.badge{background:#273747;padding:6px 14px;border-radius:20px;white-space:nowrap}.view{margin-top:24px;background:#080e15;border:1px solid #2a3b4d;border-radius:16px;min-height:300px;aspect-ratio:4/3;display:grid;place-items:center;overflow:hidden;position:relative}.view img{width:100%;height:100%;object-fit:contain}.notice{text-align:center;padding:30px;color:#b6c9db}button{background:#3c83db;color:white;border:0;border-radius:8px;padding:10px 18px;font:inherit;cursor:pointer}.toolbar{display:flex;gap:12px;align-items:center;margin:20px 0;flex-wrap:wrap}[hidden]{display:none!important}@media(max-width:600px){header{align-items:flex-start;flex-direction:column}.view{min-height:220px}main{margin-top:20px}}
</style>
<main><header><div><h1>机械臂摄像头</h1><div class="muted">实时画面 · 局域网预览</div></div><span class="badge" id="badge">连接中</span></header>
<div class="view"><img id="video" alt="摄像头实时画面" hidden><div class="notice" id="notice">正在检查摄像头…</div></div>
<div class="toolbar"><button id="pause">暂停预览</button><button id="retry">重新连接</button><span class="muted" id="details"></span></div>
<p class="muted">此页面仅查看摄像头，不控制机械臂。摄像头接入开发板后会自动尝试连接。</p></main>
<script>
const video=document.querySelector('#video'), notice=document.querySelector('#notice'), badge=document.querySelector('#badge');
let paused=false,streaming=false;
function disconnect(message){streaming=false;video.removeAttribute('src');video.hidden=true;notice.hidden=false;notice.textContent=message;}
video.onerror=()=>disconnect('画面中断，正在重新连接…');
async function poll(){try{const response=await fetch('/status',{cache:'no-store',signal:AbortSignal.timeout(4000)});if(!response.ok)throw Error();const state=await response.json();badge.textContent=paused?'已暂停':state.connected?'已连接':'等待摄像头';document.querySelector('#details').textContent=state.resolution?state.resolution.join(' × '):'';if(paused){disconnect('预览已暂停');return;}if(!state.connected){disconnect(state.message);return;}if(!streaming){streaming=true;video.src='/stream.mjpg?t='+Date.now();video.hidden=false;notice.hidden=true;}}catch{badge.textContent='服务不可达';disconnect('无法连接预览服务，请检查网线和开发板服务');}finally{setTimeout(poll,2000);}}
document.querySelector('#pause').onclick=()=>{paused=!paused;document.querySelector('#pause').textContent=paused?'继续预览':'暂停预览';if(paused)disconnect('预览已暂停');};
document.querySelector('#retry').onclick=()=>{paused=false;document.querySelector('#pause').textContent='暂停预览';disconnect('正在重新连接…');};poll();
</script></html>
